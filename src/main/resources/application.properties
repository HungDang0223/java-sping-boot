spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/sample_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.kafka.template.observation-enabled=true
spring.kafka.template.default-topic=observation-topic
spring.kafka.listener.observation-enabled=true
spring.kafka.consumer.group-id=observation-group
spring.kafka.consumer.auto-offset-reset=earliest

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.root=error
logging.level.com.example.sample08=info

management.tracing.sampling.probability=1